<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none"
     role="img" aria-label="Business Analyzer">
  <title>Business Analyzer</title>
  <!-- Single-colour twin of logo-mark.svg, for stamps, print, and anywhere the
       mark inherits its colour. The three facets are held apart by opacity
       rather than hue, so the solid still reads as a solid at one colour. -->
  <path d="M32 4 L58 19 L32 34 L6 19 Z" fill="currentColor" fill-opacity="0.45"/>
  <path d="M6 19 L32 34 L32 60 L6 45 Z" fill="currentColor" fill-opacity="0.75"/>
  <path d="M58 19 L58 45 L32 60 L32 34 Z" fill="currentColor"/>
</svg>
