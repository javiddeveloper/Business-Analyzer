<svg xmlns="http://www.w3.org/2000/svg" width="380" height="72" viewBox="0 0 380 72"
     fill="none" role="img" aria-label="Business Analyzer">
  <title>Business Analyzer</title>

  <!-- Dark-theme twin of logo.svg. The wordmark there is near-black and
       disappears against GitHub's dark theme, so the README pairs the two
       through <picture> + prefers-color-scheme. The mark's darkest facet is
       also lifted a step, since #4338CA goes muddy on a near-black page. -->

  <g transform="translate(4, 4)">
    <path d="M32 4 L58 19 L32 34 L6 19 Z" fill="#C7D2FE"/>
    <path d="M6 19 L32 34 L32 60 L6 45 Z" fill="#818CF8"/>
    <path d="M58 19 L58 45 L32 60 L32 34 Z" fill="#4F46E5"/>
  </g>

  <text x="82" y="34" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="26" font-weight="700" letter-spacing="-0.6" fill="#FAFAFA">Business</text>
  <text x="197" y="34" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="26" font-weight="500" letter-spacing="-0.6" fill="#A1A1A1">Analyzer</text>
  <text x="83" y="54" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="12" font-weight="500" letter-spacing="1.6" fill="#A1A1A1">AI CODE REVIEW &amp; TEAM INTELLIGENCE</text>
</svg>
