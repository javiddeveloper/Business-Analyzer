<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Coder Review — داشبورد</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1d212a;
    --line: #262b36;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --dim: #6b7280;
    --blue: #3b82f6;
    --green: #22c55e;
    --red: #ef4444;
    --amber: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    font-family: Tahoma, Arial, sans-serif;
    background: var(--bg); color: var(--text);
    margin: 0; padding: 16px; font-size: 14px; line-height: 1.7;
  }
  h1 { font-size: 18px; margin: 0; }
  h3 { font-size: 15px; margin: 0 0 10px; }
  a { color: var(--blue); }

  /* ---- header ---- */
  header {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    justify-content: space-between; margin-bottom: 16px;
  }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; max-width: 100%; min-width: 0; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 12px; font-size: 12px; color: var(--muted);
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: 0 0 auto; }
  .dot.ok { background: var(--green); }
  .dot.err { background: var(--red); }
  .dot.run { background: var(--blue); animation: pulse 1s infinite; }
  .dot.warn { background: var(--amber); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  /* ---- layout ---- */
  .layout { display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 1024px) {
    .layout { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); align-items: start; }
  }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px; min-width: 0;
  }

  /* ---- controls ---- */
  button {
    background: var(--blue); color: #fff; border: none; border-radius: 6px;
    padding: 7px 13px; cursor: pointer; font-family: inherit; font-size: 13px;
  }
  button:hover { opacity: .9; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  button.danger { background: var(--red); }
  input[type=text], input[type=password], textarea {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid #2b3140; border-radius: 6px; padding: 8px;
    font-family: inherit; font-size: 13px; margin-bottom: 8px;
  }
  textarea { min-height: 110px; resize: vertical; line-height: 1.7; }
  label.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  /* ---- MR tabs ---- */
  .tabs {
    display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px;
    border-bottom: 1px solid var(--line); margin-bottom: 12px;
  }
  .tab {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
    border-radius: 8px 8px 0 0; padding: 7px 12px; cursor: pointer;
    font-size: 13px; max-width: 240px;
  }
  .tab .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab.active { background: var(--bg); color: var(--text); border-color: var(--blue); }
  .tab:hover { color: var(--text); }

  /* ---- MR panel ---- */
  .meta { color: var(--muted); font-size: 12px; }
  .meta-grid { display: grid; grid-template-columns: 1fr; gap: 4px; margin: 10px 0 14px; }
  @media (min-width: 620px) { .meta-grid { grid-template-columns: 1fr 1fr; } }
  code, .mono { font-family: Consolas, "Courier New", monospace; font-size: 12px; }
  .note {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px; white-space: pre-wrap; word-break: break-word;
    line-height: 1.9; margin-top: 12px; max-height: 60vh; overflow: auto;
  }
  .verdict { display: inline-block; border-radius: 6px; padding: 3px 10px; font-size: 12px; }
  .verdict.approve { background: rgba(34,197,94,.15); color: var(--green); }
  .verdict.changes { background: rgba(239,68,68,.15); color: var(--red); }
  .finding { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-top: 10px; background: var(--bg); }
  .finding-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 6px; }
  .sev { border-radius: 5px; padding: 2px 8px; font-size: 11px; flex: 0 0 auto; }
  .sev.High { background: rgba(239,68,68,.16); color: #fca5a5; }
  .sev.Medium { background: rgba(245,158,11,.16); color: #fcd34d; }
  .sev.Low { background: rgba(59,130,246,.16); color: #93c5fd; }
  .finding-loc { font-family: Consolas, "Courier New", monospace; font-size: 12px; color: var(--muted); word-break: break-all; }
  .finding-note { white-space: pre-wrap; word-break: break-word; font-size: 13px; }
  .finding pre { background: #0b0d11; border: 1px solid var(--line); border-radius: 6px; padding: 8px; overflow-x: auto; font-size: 12px; margin: 8px 0 0; }
  .tag { font-size: 11px; color: var(--dim); }
  .settings { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
  .empty { color: var(--dim); padding: 16px 0; text-align: center; }
  .error-box { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.35); color: #fca5a5; border-radius: 8px; padding: 10px; font-size: 13px; }

  /* ---- knowledge base ---- */
  .kb-item { border-bottom: 1px solid var(--line); padding: 10px 0; }
  .kb-item:last-child { border-bottom: none; }
  .kb-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .kb-title { cursor: pointer; flex: 1; min-width: 0; }
  .kb-title strong { display: block; word-break: break-word; }
  .kb-body {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px; margin-top: 10px; white-space: pre-wrap; word-break: break-word;
    line-height: 1.9; font-size: 13px; max-height: 45vh; overflow: auto;
  }
  .kb-actions { display: flex; gap: 6px; flex: 0 0 auto; }
  .kb-actions button { padding: 4px 9px; font-size: 12px; }
  details.tokenbox summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  details.tokenbox { margin-bottom: 12px; }
</style>
</head>
<body>

<header>
  <h1>🤖 Coder Review</h1>
  <div class="badges">
    <span class="badge" id="gitlabBadge"><span class="dot"></span> گیت‌لب: در حال بررسی…</span>
    <span class="badge" id="aiBadge"><span class="dot"></span> مدل: …</span>
    <label class="check badge"><input type="checkbox" id="autoReview" /> ریویوی خودکار</label>
    <button class="ghost" id="refreshBtn">🔄 بروزرسانی</button>
  </div>
</header>

<details class="tokenbox">
  <summary>تنظیمات دسترسی (توکن ادمین)</summary>
  <input type="password" id="adminToken" placeholder="اگر ADMIN_TOKEN در secrets.env ست شده، اینجا وارد کن" />
</details>

<div class="layout">
  <!-- ---- merge requests ---- -->
  <section class="card">
    <h3>Merge Requestها</h3>
    <div class="settings">
      <label class="check"><input type="checkbox" id="setInline" /> کامنت خطی روی همان خط کد</label>
      <label class="check"><input type="checkbox" id="setSkipDrafts" /> رد کردن MRهای Draft در حالت خودکار</label>
      <label class="check"><input type="checkbox" id="setAutoPost" /> ثبت خودکار نتیجه در حالت خودکار</label>
    </div>
    <div id="mrError"></div>
    <div class="tabs" id="tabs"></div>
    <div id="mrPanel"><div class="empty">در حال بارگذاری…</div></div>
  </section>

  <!-- ---- knowledge base ---- -->
  <section class="card">
    <h3>📚 پایگاه دانش</h3>
    <p class="meta">هر یادداشت اینجا، خودکار در ریویوی هر MR به مدل داده می‌شود.</p>

    <input type="text" id="kbTitle" placeholder="عنوان" />
    <textarea id="kbContent" placeholder="متن استاندارد یا قانون تیم…"></textarea>
    <div class="row">
      <button id="kbSaveBtn">افزودن یادداشت</button>
      <button class="ghost" id="kbCancelBtn" style="display:none">انصراف از ویرایش</button>
      <input type="file" id="kbFile" accept=".md,.txt" style="flex:1; min-width:150px" />
      <button class="ghost" id="kbUploadBtn">آپلود</button>
    </div>

    <div id="kbList" style="margin-top:14px"><div class="empty">در حال بارگذاری…</div></div>
  </section>
</div>

<script>
// ---- state ----------------------------------------------------------------
const S = {
  status: null,
  mrs: [],
  jobs: {},        // key -> job
  activeKey: null,
  kb: [],
  kbOpen: null,    // id of the expanded entry
  kbBodies: {},    // id -> content
  editingId: null,
  postToGitlab: true,
};

const keyOf = (projectId, iid) => projectId + '!' + iid;
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---- api ------------------------------------------------------------------
function headers() {
  const token = document.getElementById('adminToken').value.trim();
  const h = { 'Content-Type': 'application/json' };
  if (token) h['X-Admin-Token'] = token;
  return h;
}
async function api(path, options = {}) {
  const res = await fetch(path, { ...options, headers: headers() });
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch (e) { data = { error: text.slice(0, 200) }; }
  if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
  return data;
}

// ---- header / status ------------------------------------------------------
async function loadStatus() {
  try {
    S.status = await api('/api/status');
  } catch (e) {
    S.status = { gitlab: { ok: false, error: e.message }, ai: {}, settings: {} };
  }
  renderStatus();
}

function renderStatus() {
  const g = (S.status && S.status.gitlab) || {};
  const ai = (S.status && S.status.ai) || {};
  const st = (S.status && S.status.settings) || {};
  const gBadge = document.getElementById('gitlabBadge');
  // A GitLab error can be a whole JSON body — elide it in the badge (full text
  // stays in the tooltip) so it can't blow out the header on a narrow screen.
  const short = (s) => (String(s).length > 42 ? String(s).slice(0, 42) + '…' : String(s));
  gBadge.innerHTML = '<span class="dot ' + (g.ok ? 'ok' : 'err') + '"></span> گیت‌لب: ' +
    (g.ok ? esc(g.url.replace(/^https?:\/\//, '')) + ' (' + esc(g.user || '—') + ')' : esc(short(g.error || 'قطع')));
  gBadge.title = g.ok ? 'اتصال برقرار است: ' + g.url : (g.error || '');

  document.getElementById('aiBadge').innerHTML =
    '<span class="dot ' + (ai.keySet ? 'ok' : 'warn') + '"></span> مدل: ' + esc(ai.model || '—') +
    (ai.keySet ? '' : ' (کلید تنظیم نشده)');

  document.getElementById('autoReview').checked = !!st.autoReview;
  document.getElementById('setInline').checked = st.inlineComments !== false;
  document.getElementById('setSkipDrafts').checked = st.skipDrafts !== false;
  document.getElementById('setAutoPost').checked = st.autoPost !== false;
}

// One handler for every settings checkbox — each maps to a field of the same
// name on the server's settings object.
async function bindSetting(elementId, field) {
  const el = document.getElementById(elementId);
  el.onchange = async () => {
    try {
      const next = await api('/api/settings', { method: 'POST', body: JSON.stringify({ [field]: el.checked }) });
      if (S.status) S.status.settings = next;
    } catch (err) {
      alert('خطا در ذخیره تنظیمات: ' + err.message);
      el.checked = !el.checked;
    }
  };
}
bindSetting('setInline', 'inlineComments');
bindSetting('setSkipDrafts', 'skipDrafts');
bindSetting('setAutoPost', 'autoPost');

// ---- merge requests -------------------------------------------------------
async function loadMergeRequests() {
  const box = document.getElementById('mrError');
  try {
    S.mrs = await api('/api/merge-requests');
    box.innerHTML = '';
  } catch (e) {
    S.mrs = [];
    box.innerHTML = '<div class="error-box">خطا در گرفتن لیست Merge Requestها: ' + esc(e.message) + '</div>';
  }
  if (!S.activeKey && S.mrs.length) S.activeKey = keyOf(S.mrs[0].projectId, S.mrs[0].iid);
  renderTabs();
  renderMrPanel();
}

async function loadJobs() {
  try {
    const list = await api('/api/jobs');
    S.jobs = {};
    for (const job of list) S.jobs[job.key] = job;
  } catch (e) { /* keep previous jobs on a transient failure */ }
  renderTabs();
  renderMrPanel();
}

function jobDotClass(job, mr) {
  if (!job) return (mr && mr.lastReviewedSha === mr.sha) ? 'ok' : '';
  if (job.status === 'running') return 'run';
  if (job.status === 'error') return 'warn';
  return job.decision === 'REQUEST_CHANGES' ? 'err' : 'ok';
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  if (!S.mrs.length) { tabs.innerHTML = ''; return; }
  tabs.innerHTML = S.mrs.map((mr) => {
    const key = keyOf(mr.projectId, mr.iid);
    const job = S.jobs[key];
    return '<div class="tab ' + (key === S.activeKey ? 'active' : '') + '" data-key="' + esc(key) + '" title="' + esc(mr.title) + '">' +
      '<span class="dot ' + jobDotClass(job, mr) + '"></span>' +
      '<span class="label">!' + esc(mr.iid) + ' — ' + esc(mr.title) + '</span>' +
    '</div>';
  }).join('');
  tabs.querySelectorAll('.tab').forEach((el) => {
    el.onclick = () => { S.activeKey = el.dataset.key; renderTabs(); renderMrPanel(); };
  });
}

function renderMrPanel() {
  const panel = document.getElementById('mrPanel');
  if (!S.mrs.length) {
    panel.innerHTML = '<div class="empty">هیچ Merge Request بازی پیدا نشد.</div>';
    return;
  }
  const mr = S.mrs.find((m) => keyOf(m.projectId, m.iid) === S.activeKey);
  if (!mr) { panel.innerHTML = '<div class="empty">یک MR را از بالا انتخاب کن.</div>'; return; }

  const key = keyOf(mr.projectId, mr.iid);
  const job = S.jobs[key];
  const running = job && job.status === 'running';
  const isStale = mr.lastReviewedSha && mr.sha && mr.lastReviewedSha !== mr.sha;

  let statusLine = '<span class="meta">هنوز ریویو نشده.</span>';
  if (running) statusLine = '<span class="meta"><span class="dot run"></span> در حال ریویو… (' + esc(job.trigger) + ')</span>';
  else if (job && job.status === 'error') statusLine = '<div class="error-box">خطا: ' + esc(job.error) + '</div>';
  else if (job && job.status === 'done') {
    const v = job.decision === 'APPROVE' ? '<span class="verdict approve">✅ APPROVE</span>'
      : job.decision === 'REQUEST_CHANGES' ? '<span class="verdict changes">🔴 REQUEST_CHANGES</span>'
      : '<span class="verdict">بدون تصمیم مشخص</span>';
    const st = job.stats || {};
    const pub = job.publishResult || {};
    const bits = [
      esc(st.files || 0) + ' فایل بررسی شد',
      st.skipped ? esc(st.skipped) + ' فایل رد شد' : '',
      (job.findings || []).length + ' یافته',
      job.posted ? (pub.inline ? esc(pub.inline) + ' کامنت خطی ثبت شد' : 'خلاصه روی گیت‌لب ثبت شد') : 'روی گیت‌لب ثبت نشده',
      pub.skippedDuplicate ? esc(pub.skippedDuplicate) + ' مورد تکراری رد شد' : '',
      st.promptTokens || st.completionTokens ? 'توکن: ' + esc(st.promptTokens) + '+' + esc(st.completionTokens) : '',
      esc(job.trigger),
    ].filter(Boolean);
    statusLine = v + ' <span class="meta">· ' + bits.join(' · ') + '</span>' +
      (job.summary ? '<div class="meta" style="margin-top:6px">' + esc(job.summary) + '</div>' : '');
  } else if (mr.lastReviewedSha && !isStale) {
    statusLine = '<span class="meta">این کامیت قبلاً ریویو شده است (نتیجه‌اش در این نشست نیست).</span>';
  }

  panel.innerHTML =
    '<div class="row" style="justify-content:space-between">' +
      '<strong style="word-break:break-word">!' + esc(mr.iid) + ' — ' + esc(mr.title) + '</strong>' +
      (mr.webUrl ? '<a href="' + esc(mr.webUrl) + '" target="_blank" rel="noreferrer">باز کردن در گیت‌لب ↗</a>' : '') +
    '</div>' +
    '<div class="meta-grid">' +
      '<div class="meta">شاخه: <span class="mono">' + esc(mr.sourceBranch) + ' → ' + esc(mr.targetBranch) + '</span></div>' +
      '<div class="meta">نویسنده: ' + esc(mr.author) + (mr.draft ? ' · <b>Draft</b>' : '') + '</div>' +
      '<div class="meta">کامیت فعلی: <span class="mono">' + esc((mr.sha || '').slice(0, 8)) + '</span>' +
        (isStale ? ' <b style="color:var(--amber)">(بعد از آخرین ریویو تغییر کرده)</b>' : '') + '</div>' +
      '<div class="meta">آخرین بروزرسانی: ' + esc(new Date(mr.updatedAt).toLocaleString('fa-IR')) + '</div>' +
    '</div>' +
    '<div class="row">' +
      '<button id="runBtn" ' + (running ? 'disabled' : '') + '>' + (running ? 'در حال اجرا…' : '▶ اجرای ریویو') + '</button>' +
      '<label class="check"><input type="checkbox" id="postChk" ' + (S.postToGitlab ? 'checked' : '') + ' /> کامنت روی گیت‌لب ثبت شود</label>' +
      (job && job.note && !job.posted ? '<button class="ghost" id="postBtn">💬 ثبت این نتیجه روی MR</button>' : '') +
    '</div>' +
    '<div style="margin-top:10px">' + statusLine + '</div>' +
    renderFindings(job);

  const runBtn = document.getElementById('runBtn');
  if (runBtn) runBtn.onclick = () => runReview(mr);
  const postChk = document.getElementById('postChk');
  if (postChk) postChk.onchange = (e) => { S.postToGitlab = e.target.checked; };
  const postBtn = document.getElementById('postBtn');
  if (postBtn) postBtn.onclick = () => postNote(mr);
}

function renderFindings(job) {
  if (!job || job.status !== 'done') return '';
  const findings = job.findings || [];
  if (!findings.length) return '<div class="note">هیچ یافته‌ای ثبت نشد.</div>';
  return findings.map((f) => {
    const loc = f.line ? f.file + ':' + f.line : (f.file || 'کل MR');
    return '<div class="finding">' +
      '<div class="finding-head">' +
        '<span class="sev ' + esc(f.severity) + '">' + esc(f.severity) + '</span>' +
        '<strong style="min-width:0;word-break:break-word">' + esc(f.title) + '</strong>' +
        '<span class="tag">' + esc(f.category) + (f.source === 'auto' ? ' · بررسی خودکار' : '') +
          (f.postedInline ? ' · روی خط ثبت شد' : '') + '</span>' +
      '</div>' +
      '<div class="finding-loc">' + esc(loc) + (f.lineUnverified ? ' (خط ادعایی مدل: ' + esc(f.claimedLine) + ' — در دیف نبود)' : '') + '</div>' +
      '<div class="finding-note">' + esc(f.note) + '</div>' +
      (f.suggestion ? '<pre>' + esc(f.suggestion) + '</pre>' : '') +
    '</div>';
  }).join('');
}

async function runReview(mr) {
  try {
    const job = await api('/api/review', {
      method: 'POST',
      body: JSON.stringify({ projectId: mr.projectId, iid: mr.iid, title: mr.title, webUrl: mr.webUrl, post: S.postToGitlab }),
    });
    S.jobs[job.key] = job;
    renderTabs(); renderMrPanel();
  } catch (e) {
    alert('خطا در شروع ریویو: ' + e.message);
  }
}

async function postNote(mr) {
  try {
    const job = await api('/api/post-note', { method: 'POST', body: JSON.stringify({ projectId: mr.projectId, iid: mr.iid }) });
    S.jobs[job.key] = job;
    renderMrPanel();
  } catch (e) {
    alert('خطا در ثبت کامنت: ' + e.message);
  }
}

// ---- settings -------------------------------------------------------------
document.getElementById('autoReview').onchange = async (e) => {
  try {
    const next = await api('/api/settings', { method: 'POST', body: JSON.stringify({ autoReview: e.target.checked }) });
    if (S.status) S.status.settings = next;
  } catch (err) {
    alert('خطا در ذخیره تنظیمات: ' + err.message);
    e.target.checked = !e.target.checked;
  }
};

document.getElementById('refreshBtn').onclick = async () => {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true; btn.textContent = '⏳ …';
  await Promise.all([loadStatus(), loadMergeRequests(), loadJobs()]);
  btn.disabled = false; btn.textContent = '🔄 بروزرسانی';
};

// ---- knowledge base -------------------------------------------------------
async function loadKb() {
  const box = document.getElementById('kbList');
  try {
    S.kb = await api('/api/knowledge');
  } catch (e) {
    box.innerHTML = '<div class="error-box">خطا: ' + esc(e.message) + '</div>';
    return;
  }
  renderKb();
}

function renderKb() {
  const box = document.getElementById('kbList');
  if (!S.kb.length) { box.innerHTML = '<div class="empty">هنوز یادداشتی اضافه نشده.</div>'; return; }
  box.innerHTML = S.kb.map((it) => {
    const open = S.kbOpen === it.id;
    const body = open ? '<div class="kb-body">' + esc(S.kbBodies[it.id] || 'در حال بارگذاری…') + '</div>' : '';
    return '<div class="kb-item">' +
      '<div class="kb-head">' +
        '<div class="kb-title" data-id="' + esc(it.id) + '">' +
          '<strong>' + (open ? '▾ ' : '▸ ') + esc(it.title) + '</strong>' +
          '<span class="meta">' + esc(it.source) + ' · ' + esc(new Date(it.updatedAt).toLocaleString('fa-IR')) + ' · ' + esc(it.sizeChars) + ' کاراکتر</span>' +
        '</div>' +
        '<div class="kb-actions">' +
          '<button class="ghost" data-edit="' + esc(it.id) + '">ویرایش</button>' +
          '<button class="danger" data-del="' + esc(it.id) + '">حذف</button>' +
        '</div>' +
      '</div>' + body +
    '</div>';
  }).join('');

  box.querySelectorAll('.kb-title').forEach((el) => { el.onclick = () => toggleKb(el.dataset.id); });
  box.querySelectorAll('[data-edit]').forEach((el) => { el.onclick = () => editKb(el.dataset.edit); });
  box.querySelectorAll('[data-del]').forEach((el) => { el.onclick = () => deleteKb(el.dataset.del); });
}

async function fetchKbBody(id) {
  if (S.kbBodies[id]) return S.kbBodies[id];
  const data = await api('/api/knowledge/' + id);
  S.kbBodies[id] = data.content || '';
  return S.kbBodies[id];
}

async function toggleKb(id) {
  if (S.kbOpen === id) { S.kbOpen = null; renderKb(); return; }
  S.kbOpen = id;
  renderKb();
  await fetchKbBody(id);
  renderKb();
}

async function editKb(id) {
  const content = await fetchKbBody(id);
  const meta = S.kb.find((k) => k.id === id);
  S.editingId = id;
  document.getElementById('kbTitle').value = (meta && meta.title) || '';
  document.getElementById('kbContent').value = content;
  document.getElementById('kbSaveBtn').textContent = 'ذخیره تغییرات';
  document.getElementById('kbCancelBtn').style.display = '';
  document.getElementById('kbTitle').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function resetKbForm() {
  S.editingId = null;
  document.getElementById('kbTitle').value = '';
  document.getElementById('kbContent').value = '';
  document.getElementById('kbSaveBtn').textContent = 'افزودن یادداشت';
  document.getElementById('kbCancelBtn').style.display = 'none';
}

document.getElementById('kbCancelBtn').onclick = resetKbForm;

document.getElementById('kbSaveBtn').onclick = async () => {
  const title = document.getElementById('kbTitle').value.trim();
  const content = document.getElementById('kbContent').value.trim();
  if (!content) return alert('متن یادداشت خالی است.');
  try {
    await api('/api/knowledge', { method: 'POST', body: JSON.stringify({ id: S.editingId || undefined, title, content }) });
    if (S.editingId) delete S.kbBodies[S.editingId];
    resetKbForm();
    await loadKb();
  } catch (e) { alert('خطا: ' + e.message); }
};

document.getElementById('kbUploadBtn').onclick = async () => {
  const input = document.getElementById('kbFile');
  const f = input.files[0];
  if (!f) return alert('یک فایل انتخاب کن.');
  const ext = f.name.split('.').pop();
  const bytes = new Uint8Array(await f.arrayBuffer());
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  try {
    await api('/api/knowledge', { method: 'POST', body: JSON.stringify({ title: f.name, ext, fileBase64: btoa(bin) }) });
    input.value = '';
    await loadKb();
  } catch (e) { alert('خطا: ' + e.message); }
};

async function deleteKb(id) {
  if (!confirm('این یادداشت حذف شود؟')) return;
  try {
    await api('/api/knowledge/' + id, { method: 'DELETE' });
    delete S.kbBodies[id];
    if (S.kbOpen === id) S.kbOpen = null;
    if (S.editingId === id) resetKbForm();
    await loadKb();
  } catch (e) { alert('خطا: ' + e.message); }
}

// ---- boot -----------------------------------------------------------------
document.getElementById('adminToken').onchange = () => { loadStatus(); loadMergeRequests(); loadKb(); };

loadStatus();
loadMergeRequests().then(loadJobs);
loadKb();

// Live status for every tab at once — so several MRs reviewing in parallel all
// stay up to date, not just the one being looked at.
setInterval(loadJobs, 4000);
// The MR list itself changes far more slowly than job state.
setInterval(loadMergeRequests, 60000);
</script>
